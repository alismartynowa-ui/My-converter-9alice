                defaultFrom: 'kmh',
                defaultTo: 'ms',
                units: {
                    ms: { name: 'Метри за секунду', short: 'м/с', factor: 1 },
                    kmh: { name: 'Кілометри за годину', short: 'км/год', factor: 1 / 3.6 },
                    mph: { name: 'Милі за годину', short: 'миль/год', factor: 0.44704 },
                    kn: { name: 'Вузли', short: 'вуз.', factor: 0.514444444 }
                }
            },
            time: {
                name: 'Час',
                icon: '⏱️',
                defaultFrom: 'h',
                defaultTo: 'min',
                units: {
                    s: { name: 'Секунди', short: 'сек', factor: 1 },
                    min: { name: 'Хвилини', short: 'хв', factor: 60 },
                    h: { name: 'Години', short: 'год', factor: 3600 },
                    d: { name: 'Дні', short: 'дн', factor: 86400 },
                    w: { name: 'Тижні', short: 'тиж', factor: 604800 }
                }
            },
            data: {
                name: 'Інформація',
                icon: '💾',
                defaultFrom: 'gb',
                defaultTo: 'mb',
                units: {
                    b: { name: 'Байти', short: 'Б', factor: 1 },
                    kb: { name: 'Кілобайти (1024)', short: 'КБ', factor: 1024 },
                    mb: { name: 'Мегабайти', short: 'МБ', factor: 1048576 },
                    gb: { name: 'Гігабайти', short: 'ГБ', factor: 1073741824 },
                    tb: { name: 'Терабайти', short: 'ТБ', factor: 1099511627776 }
                }
            },
            pressure: {
                name: 'Тиск',
                icon: ' gauge',
                iconSymbol: '⏲️',
                defaultFrom: 'bar',
                defaultTo: 'mmhg',
                units: {
                    pa: { name: 'Паскалі', short: 'Па', factor: 1 },
                    kpa: { name: 'Кілопаскалі', short: 'кПа', factor: 1000 },
                    bar: { name: 'Бари', short: 'бар', factor: 100000 },
                    atm: { name: 'Атмосфери (фіз.)', short: 'атм', factor: 101325 },
                    mmhg: { name: 'Мм рт. стовпчика', short: 'мм рт.ст.', factor: 133.3223874 },
                    psi: { name: 'Фунт на кв. дюйм', short: 'PSI', factor: 6894.757293 }
                }
            },
            energy: {
                name: 'Енергія',
                icon: '⚡',
                defaultFrom: 'kcal',
                defaultTo: 'kj',
                units: {
                    j: { name: 'Джоулі', short: 'Дж', factor: 1 },
                    kj: { name: 'Кілоджоулі', short: 'кДж', factor: 1000 },
                    cal: { name: 'Калорії', short: 'кал', factor: 4.184 },
                    kcal: { name: 'Кілокалорії', short: 'ккал', factor: 4184 },
                    wh: { name: 'Ват-години', short: 'Вт·год', factor: 3600 },
                    kwh: { name: 'Кіловат-години', short: 'кВт·год', factor: 3600000 }
                }
            }
        };

        // Стан додатку
        let currentCategory = 'length';
        let currentFromUnit = CONVERTER_DATA.length.defaultFrom;
        let currentToUnit = CONVERTER_DATA.length.defaultTo;
        let showNumpad = true;

        // DOM елементи
        const categoryTabsEl = document.getElementById('categoryTabs');
        const fromUnitSelect = document.getElementById('fromUnitSelect');
        const toUnitSelect = document.getElementById('toUnitSelect');
        const inputValueEl = document.getElementById('inputValue');
        const outputValueEl = document.getElementById('outputValue');
        const allUnitsListEl = document.getElementById('allUnitsList');
        const swapBtn = document.getElementById('swapBtn');
        const clearInputBtn = document.getElementById('clearInputBtn');
        const copyBtn = document.getElementById('copyBtn');
        const signBtn = document.getElementById('signBtn');
        const numpadContainer = document.getElementById('numpadContainer');
        const toggleNumpadBtn = document.getElementById('toggleNumpadBtn');
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        const toastEl = document.getElementById('toast');
        const toastMsgEl = document.getElementById('toastMsg');

        /**
         * Ініціалізація теми (враховує системну тему або збережений вибір)
         */
        function initTheme() {
            const savedTheme = localStorage.getItem('converter_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
        }

        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('converter_theme', isDark ? 'dark' : 'light');
            sunIcon.classList.toggle('hidden', !isDark);
            moonIcon.classList.toggle('hidden', isDark);
        });

        /**
         * Показ спливаючого повідомлення (Toast)
         */
        let toastTimeout;
        function showToast(message) {
            toastMsgEl.textContent = message;
            toastEl.classList.remove('opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.classList.add('opacity-0');
            }, 1800);
        }

        /**
         * Копіювання тексту в буфер обміну з fallback на execCommand
         */
        function copyToClipboard(text, label = '') {
            if (!text || text === '—') return;
            
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                showToast(label ? `Скопійовано: ${text} ${label}` : `Скопійовано: ${text}`);
            } catch (err) {
                showToast('Не вдалося скопіювати');
            }
            document.body.removeChild(textArea);
        }

        /**
         * Форматування чисел для гарного відображення без похибок плаваючої коми
         */
        function formatNumber(num) {
            if (isNaN(num) || !isFinite(num)) return '—';
            if (num === 0) return '0';

            const absNum = Math.abs(num);
            
            // Для дуже великих або дуже малих чисел використовуємо науковий формат
            if (absNum >= 1e12 || (absNum < 1e-7 && absNum > 0)) {
                return num.toExponential(5).replace(/\.?0+e/, 'e');
            }

            // Округлення до 8 значущих цифр після коми для уникнення 0.30000000000000004
            const rounded = Number(num.toPrecision(10));
            
            // Форматуємо з пробілами для тисяч, зберігаючи дробову частину
            const parts = rounded.toString().split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return parts.join(',');
        }

        /**
         * Логіка математичної конвертації
         */
        function convertValue(value, fromKey, toKey, categoryKey) {
            const category = CONVERTER_DATA[categoryKey];
            if (!category || isNaN(value)) return NaN;
            if (fromKey === toKey) return value;

            // Окрема формула для температури
            if (category.isTemperature) {
                let celsius;
                if (fromKey === 'c') celsius = value;
                else if (fromKey === 'f') celsius = (value - 32) * (5 / 9);
                else if (fromKey === 'k') celsius = value - 273.15;

                if (toKey === 'c') return celsius;
                if (toKey === 'f') return (celsius * 9 / 5) + 32;
                if (toKey === 'k') return celsius + 273.15;
            }

            // Стандартна конвертація через базову одиницю
            const fromFactor = category.units[fromKey].factor;
            const toFactor = category.units[toKey].factor;
            const baseValue = value * fromFactor;
            return baseValue / toFactor;
        }

        /**
         * Рендер верхніх вкладок категорій
         */
        function renderCategoryTabs() {
            categoryTabsEl.innerHTML = '';
            Object.entries(CONVERTER_DATA).forEach(([key, cat]) => {
                const isActive = key === currentCategory;
                const icon = cat.iconSymbol || cat.icon;
                const btn = document.createElement('button');
                btn.className = `btn-press shrink-0 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all ${
                    isActive 
                        ? 'bg-blue-600 text-white shadow-sm shadow-blue-600/25' 
                        : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700 border border-slate-200/80 dark:border-slate-700'
                }`;
                btn.innerHTML = `<span>${icon}</span><span>${cat.name}</span>`;
                btn.onclick = () => selectCategory(key);
                categoryTabsEl.appendChild(btn);

                if (isActive) {
                    setTimeout(() => {
                        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }, 50);
                }
            });
        }

        /**
         * Заповнення випадаючих списків одиниць для обраної категорії
         */
        function populateUnitSelects() {
            const units = CONVERTER_DATA[currentCategory].units;
            fromUnitSelect.innerHTML = '';
            toUnitSelect.innerHTML = '';

            Object.entries(units).forEach(([key, unit]) => {
                const label = `${unit.name} (${unit.short})`;
                
                const optFrom = document.createElement('option');
                optFrom.value = key;
                optFrom.textContent = label;
                if (key === currentFromUnit) optFrom.selected = true;
                fromUnitSelect.appendChild(optFrom);

                const optTo = document.createElement('option');
                optTo.value = key;
                optTo.textContent = label;
                if (key === currentToUnit) optTo.selected = true;
                toUnitSelect.appendChild(optTo);
            });
        }

        /**
         * Вибір категорії
         */
        function selectCategory(catKey) {
            currentCategory = catKey;
            currentFromUnit = CONVERTER_DATA[catKey].defaultFrom;
            currentToUnit = CONVERTER_DATA[catKey].defaultTo;
            
            renderCategoryTabs();
            populateUnitSelects();
            updateCalculations();
        }

        /**
         * Отримання числового значення з поля вводу (підтримка крапки і коми)
         */
        function getParsedInput() {
            const raw = inputValueEl.value.replace(/\s+/g, '').replace(',', '.');
            if (raw === '' || raw === '-' || raw === '.') return NaN;
            return parseFloat(raw);
        }

        /**
         * Головна функція перерахунку та оновлення інтерфейсу
         */
        function updateCalculations() {
            const val = getParsedInput();
            const units = CONVERTER_DATA[currentCategory].units;

            if (isNaN(val)) {
                outputValueEl.textContent = '0';
            } else {
                const result = convertValue(val, currentFromUnit, currentToUnit, currentCategory);
                outputValueEl.textContent = formatNumber(result);
            }

            // Оновлення списку "Усі одиниці одразу"
            renderAllUnitsList(isNaN(val) ? 0 : val, units);
        }

        /**
         * Рендер таблиці всіх одиниць поточної категорії
         */
        function renderAllUnitsList(baseInputVal, units) {
            allUnitsListEl.innerHTML = '';
            
            Object.entries(units).forEach(([key, unit]) => {
                const converted = convertValue(baseInputVal, currentFromUnit, key, currentCategory);
                const formatted = formatNumber(converted);
                const isSource = key === currentFromUnit;
                const isTarget = key === currentToUnit;

                const row = document.createElement('div');
                row.className = `btn-press flex items-center justify-between px-3.5 py-2.5 cursor-pointer transition-colors ${
                    isTarget 
                        ? 'bg-emerald-50/70 dark:bg-emerald-950/30' 
                        : isSource 
                            ? 'bg-blue-50/50 dark:bg-blue-950/20' 
                            : 'hover:bg-slate-50 dark:hover:bg-slate-800/60'
                }`;
                
                row.innerHTML = `
                    <div class="flex flex-col pr-2 min-w-0">
                        <span class="text-xs font-semibold text-slate-800 dark:text-slate-200 truncate">
                            ${unit.name}
                            ${isTarget ? '<span class="ml-1.5 text-[10px] px-1.5 py-0.5 rounded bg-emerald-100 dark:bg-emerald-900 text-emerald-700 dark:text-emerald-300 font-bold">Обрано</span>' : ''}
                        </span>
                        <span class="text-[11px] text-slate-400 font-medium">${unit.short}</span>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <span class="font-mono text-sm font-bold ${isTarget ? 'text-emerald-700 dark:text-emerald-400' : 'text-slate-900 dark:text-slate-100'}">
                            ${formatted}
                        </span>
                    </div>
                `;

                // Клік по рядку копіює значення цієї одиниці
                row.onclick = () => {
                    const cleanCopyVal = formatted.replace(/\s+/g, '');
                    copyToClipboard(cleanCopyVal, unit.short);
                };

                allUnitsListEl.appendChild(row);
            });
        }

        /**
         * Події елементів керування
         */
        fromUnitSelect.addEventListener('change', (e) => {
            currentFromUnit = e.target.value;
            updateCalculations();
        });

        toUnitSelect.addEventListener('change', (e) => {
            currentToUnit = e.target.value;
            updateCalculations();
        });

        // Фільтрація вводу з клавіатури (дозволяємо цифри, крапку, кому та мінус)
        inputValueEl.addEventListener('input', (e) => {
            let val = e.target.value;
            // Замінюємо кому на крапку для уніфікації, залишаємо тільки коректні символи
            val = val.replace(/,/g, '.').replace(/[^0-9.-]/g, '');
            
            // Заборона більше однієї крапки
            const dotParts = val.split('.');
            if (dotParts.length > 2) {
                val = dotParts[0] + '.' + dotParts.slice(1).join('');
            }
            
            // Мінус дозволений лише на початку
            if (val.indexOf('-') > 0) {
                val = val.replace(/-/g, '');
            }
            
            e.target.value = val;
            updateCalculations();
        });

        // Кнопка Swap (поміняти одиниці місцями)
        function handleSwap() {
            const temp = currentFromUnit;
            currentFromUnit = currentToUnit;
            currentToUnit = temp;
            
            fromUnitSelect.value = currentFromUnit;
            toUnitSelect.value = currentToUnit;
            updateCalculations();
        }
        swapBtn.addEventListener('click', handleSwap);

        // Кнопка очищення
        clearInputBtn.addEventListener('click', () => {
            inputValueEl.value = '';
            inputValueEl.focus();
            updateCalculations();
        });

        // Кнопка копіювання головного результату
        copyBtn.addEventListener('click', () => {
            const rawResult = outputValueEl.textContent.replace(/\s+/g, '');
            const unitShort = CONVERTER_DATA[currentCategory].units[currentToUnit].short;
            copyToClipboard(rawResult, unitShort);
        });

        // Кнопка зміни знаку (±)
        signBtn.addEventListener('click', () => {
            let val = inputValueEl.value.trim();
            if (!val || val === '0') return;
            if (val.startsWith('-')) {
                inputValueEl.value = val.slice(1);
            } else {
                inputValueEl.value = '-' + val;
            }
            updateCalculations();
        });

        // Швидкі пресети (1, 10, 100)
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                inputValueEl.value = btn.dataset.preset;
                updateCalculations();
            });
        });

        // Обробка натискань вбудованої цифрової панелі
        document.querySelectorAll('.num-key').forEach(btn => {
            btn.addEventListener('click', () => {
                const key = btn.dataset.key;
                let current = inputValueEl.value;

                if (key === 'CLEAR') {
                    inputValueEl.value = '';
                } else if (key === 'BACKSPACE') {
                    inputValueEl.value = current.slice(0, -1);
                } else if (key === 'SWAP') {
                    handleSwap();
                    return;
                } else if (key === '.') {
                    if (!current.includes('.')) {
                        inputValueEl.value = (current === '' || current === '-') ? current + '0.' : current + '.';
                    }
                } else {
                    if (current === '0') {
                        inputValueEl.value = key === '00' ? '0' : key;
                    } else {
                        inputValueEl.value = current + key;
                    }
                }
                updateCalculations();
            });
        });

        // Показати / приховати вбудовану цифрову панель
        toggleNumpadBtn.addEventListener('click', () => {
            showNumpad = !showNumpad;
            numpadContainer.classList.toggle('hidden', !showNumpad);
            toggleNumpadBtn.classList.toggle('ring-2', showNumpad);
            toggleNumpadBtn.classList.toggle('ring-blue-500', showNumpad);
        });

        // Запуск додатку при завантаженні сторінки
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderCategoryTabs();
            populateUnitSelects();
            updateCalculations();
        });
    </script>
</body>
</html>
